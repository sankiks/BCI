model_name: multiscale_eeg_cnn
task_type: task_a_binary_lr

subject_split:
  # subject_dependent_run | subject_independent_groupkfold | subject_independent_logo
  mode: subject_independent_groupkfold
  test_run_fraction: 0.2
  n_splits: 5

batch_size: 64
learning_rates: [0.001, 0.0003]
epochs: 80
dropout: 0.4
bandpass_range: [8.0, 30.0]

weight_decay: 0.0001
use_class_weights: true
label_smoothing: 0.0

augmentation:
  # none | basic | full
  preset: none
  # Optional overrides (if omitted, preset defaults are used):
  # gaussian_noise_std: 0.01
  # temporal_jitter_max: 8
  # channel_dropout_prob: 0.1
  # amplitude_scale_min: 0.9
  # amplitude_scale_max: 1.1
  # mixup_alpha: 0.2
  # mixup_prob: 0.5

early_stopping_patience: 12
early_stopping_min_delta: 0.00001

checkpoint_dir: artifacts/checkpoints
save_best_checkpoint: true

num_workers: 0
random_seed: 42
device: null
verbose: false
